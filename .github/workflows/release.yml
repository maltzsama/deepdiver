name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The tag is created by GITHUB_TOKEN, which never triggers tag-based
  # workflows (GitHub anti-recursion). So image, chart, docs and Pages all
  # publish HERE, in the same run that merged the release PR - one pipeline,
  # no PAT needed.
  image:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: compute image tags
        id: tags
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${VERSION#v}"
          MAJOR_MINOR="${VERSION%.*}"
          echo "tags=ghcr.io/maltzsama/lakedeepdiver:${VERSION},ghcr.io/maltzsama/lakedeepdiver:${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  # Chart publish: chart-releaser packages the chart, creates the chart
  # GitHub release (tgz asset) and writes the index to gh-pages (storage
  # only - never the deployment source).
  chart:
    needs: [ release-please, image ]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: azure/setup-helm@v4
      - uses: helm/chart-releaser-action@v1
        with:
          charts_dir: infra/helm
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_INDEX_PATH: ".cr-index"
      - name: include artifacthub metadata
        run: |
          sed "s/REPLACE_ME/${{ secrets.ARTIFACTHUB_REPO_ID }}/" \
            infra/helm/artifacthub-repo.yml > .cr-index/artifacthub-repo.yml
      - name: stage chart index for Pages
        run: |
          # .cr-index is the gh-pages branch checked out by chart-releaser, so
          # it contains a .git dir that upload-artifact@v4 refuses to upload
          # (treated as an embedded repository). Copy just the files the Helm
          # repo needs into a clean dir.
          mkdir -p chart-index
          cp .cr-index/index.yaml chart-index/
          cp .cr-index/artifacthub-repo.yml chart-index/
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: chart-index
          if-no-files-found: error

  # Docs + Helm index are published by the Pages workflow, which owns the whole
  # site: every Pages deploy replaces it, so they cannot be deployed separately.
  # The chart job's artifact carries index.yaml into that run.
  pages:
    needs: [ release-please, chart ]
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      chart-index-artifact: chart
    secrets: inherit
