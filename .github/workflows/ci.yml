name: CI

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare the test database
        run: RAILS_ENV=test bin/rails db:prepare

      - name: Run Rails test suite
        run: bin/rails test

      - name: Run RSpec suite
        run: RAILS_ENV=test bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: azure/setup-helm@v4
      - name: no deployment-specific assumptions in the chart
        run: |
          ! grep -rniE 'etg-ca|ceph|argocd|argoproj|kyverno|cloudnativepg|anomalyco|registry\.example\.com|etraveli' infra/helm/
      - name: validate artifacthub metadata
        run: |
          sed "s/REPLACE_ME/test/" infra/helm/artifacthub-repo.yml | grep "repositoryID: test"
      - run: helm lint infra/helm/lakedeepdiver
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          helm template infra/helm/lakedeepdiver | ./kubeconform -strict -summary

  schema-portability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }
      - name: schema.rb loads on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/ldd_schema_check
          DB_QUEUE_URL: postgresql://postgres@localhost:5432/ldd_schema_check_queue
          RAILS_ENV: production
          SECRET_KEY_BASE: dummy
        run: bin/rails db:create db:schema:load

  # Validate the Dockerfile on every PR so a broken image surfaces before the
  # release workflow builds and pushes it on a tag. No push, no registry.
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lakedeepdiver:ci

  # The docs build used to pass `--readme`, which RDoc does not have: it was
  # silently ignored ("invalid options are ignored") and the landing page stayed
  # on RDoc's placeholder for months. docs:verify asserts the README rendered
  # and, when DATA_TRACKING is available, that the tracking script is present.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: build documentation
        run: bundle exec rake docs:build
        env:
          SSO_ENABLED: "false"
          SECRET_KEY_BASE_DUMMY: "1"
          DATA_TRACKING: ${{ secrets.DATA_TRACKING }}

      - name: verify documentation
        run: bundle exec rake docs:verify
        env:
          DATA_TRACKING: ${{ secrets.DATA_TRACKING }}

