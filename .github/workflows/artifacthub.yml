name: artifacthub-metadata

on:
  push:
    branches: [ main ]
    paths: [ "infra/helm/artifacthub-repo.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: src }

      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: pages }

      - name: sincronizar metadata
        working-directory: pages
        run: |
          set -euo pipefail
          cp ../src/infra/helm/artifacthub-repo.yml ./artifacthub-repo.yml
          if git diff --quiet -- artifacthub-repo.yml; then
            echo "sem mudança"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacthub-repo.yml
          git commit -m "chore(artifacthub): sync repository metadata"
          git push
