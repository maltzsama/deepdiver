name: artifacthub-metadata

on:
  push:
    branches: [ main ]
    paths: [ "infra/helm/artifacthub-repo.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: build pages artifact preserving published index
        run: |
          set -euo pipefail
          mkdir -p .cr-index
          curl -fsSL -o .cr-index/index.yaml https://maltzsama.github.io/lakedeepdiver/index.yaml \
            || { echo "no published index yet"; rm -f .cr-index/index.yaml; }
          sed "s/REPLACE_ME/${{ secrets.ARTIFACTHUB_REPO_ID }}/" \
            infra/helm/artifacthub-repo.yml > .cr-index/artifacthub-repo.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cr-index

      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
