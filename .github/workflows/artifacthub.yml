name: artifacthub-metadata

# Republishes the site when the Artifact Hub metadata changes, without waiting
# for a release. It used to deploy Pages itself with a site containing only
# index.yaml + artifacthub-repo.yml, which removed the whole documentation from
# the published site. It now delegates to the Pages workflow, which always
# assembles docs and the Helm index together.

on:
  push:
    branches: [ main ]
    paths: [ "infra/helm/artifacthub-repo.yml" ]
  workflow_dispatch:

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/pages.yml
    secrets: inherit
