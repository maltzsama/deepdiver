# Worker deployment: maintenance, default, sync + dispatcher with recurring.
# Used by Helm worker deployment via SOLID_QUEUE_CONFIG.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      recurring_tasks: true
  workers:
    - queues: maintenance
      threads: 1
      polling_interval: 1
    - queues: dispatch
      threads: 1
      polling_interval: 1
    - queues: default
      threads: 2
      polling_interval: 2
    - queues: sync
      threads: 1
      polling_interval: 2

production:
  <<: *default
