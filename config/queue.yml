default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      # Recurring tasks only here. See the duplication note below.
      recurring_tasks: true
  workers:
    # Maintenance: serial by design. A single coordinator runs one heavy query
    # at a time; more threads would only contend for the same engine.
    - queues: maintenance
      threads: 1
      polling_interval: 1

    # Freshness: one sweep at a time, but in its own process so it never waits
    # behind an optimize.
    - queues: freshness
      threads: 1
      polling_interval: 1

    # Sync: catalog list refresh, idempotent and fast.
    - queues: sync
      threads: 1
      polling_interval: 2

    # Default: Slack alerts, ad-hoc jobs, anything without a named queue.
    - queues: default
      threads: 2
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default