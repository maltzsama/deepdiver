default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
      recurring_tasks: true
  workers:
    # Engine: engine lifecycle only — supervise start, drain, watchdog.
    # Serial: only one lifecycle job at a time.
    - queues: engine
      threads: 1
      polling_interval: 1

    # Maintenance: serial. Runs execution, dispatches work.
    - queues: maintenance
      threads: 1
      polling_interval: 1

    # Freshness: one sweep at a time, never waits behind engine work.
    - queues: freshness
      threads: 1
      polling_interval: 1

    # Sync: catalog list refresh, idempotent and fast.
    - queues: sync
      threads: 1
      polling_interval: 2

    # Default: Slack alerts, ad-hoc jobs, data retention, STS refresh.
    - queues: default
      threads: 2
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
