# Default values for deepdiver.
# This is a YAML-formatted file. Overrides are provided by the consumer, one
# file per environment (see the chart README for the convention this repo uses).

replicaCount: 1

image:
  repository: ghcr.io/maltzsama/deepdiver
  pullPolicy: IfNotPresent
  # x.y.z - tag is pinned per environment, never "latest" in production.
  tag: "0.4.1" # x-release-please-version

# Credentials for a private registry mirror, e.g. [{name: my-registry-creds}].
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Application credentials never live in this chart. DATABASE_URL, DB_QUEUE_URL,
# RAILS_MASTER_KEY and SECRET_KEY_BASE are provided by an out-of-band Secret
# (SealedSecrets / external controller) referenced through appSecrets.existingSecret.
appSecrets:
  existingSecret: ""
  # For simple local experiments only - renders a Secret from values.data.
  create: false
  data:
    DATABASE_URL: ""
    DB_QUEUE_URL: ""
    RAILS_MASTER_KEY: ""
    SECRET_KEY_BASE: ""

# Internal TLS trust: an internal CA can be mounted from an external Secret and
# exposed to the app via INTERNAL_CA_FILE. The chart never stores certificates.
internalCA:
  enabled: false
  # A dedicated directory, not /etc/ssl/certs: the volume mount covers the
  # whole directory (Secret has one key, internal-ca.crt), and /etc/ssl/certs
  # is the system CA bundle location - mounting there replaces
  # ca-certificates.crt and every other system cert, breaking HTTPS to any
  # public endpoint (e.g. Slack webhooks) the moment internalCA is enabled.
  mountFile: /etc/deepdiver/certs/internal-ca.crt
  existingSecret: ""
  caKey: ca.crt

# Active Record Encryption keys. MUST be provided via existingSecret.
# Generate with: bin/rails db:encryption:init
# Losing these keys makes all catalog credentials unrecoverable.
activeRecordEncryption:
  existingSecret: ""

# Application tuning knobs surfaced as environment variables.
env:
  # Both of the next two are read with a bare ENV.fetch in the app
  # (RealTrinoRuntime, ChartTrinoProvisioner, K8sClientFactory), so an absent
  # key is a KeyError on the first "Run" - the app boots fine and only then
  # dies. They default to the conventional in-cluster names instead of empty:
  # a wrong host is a legible connection error, an absent key is not.
  trinoUrl: "http://trino-coordinator:8080"
  # Namespace where the Trino engine lives. Leave empty to use the release
  # namespace. When set to a DIFFERENT namespace, the chart also creates the
  # Role/RoleBinding there, binding the release ServiceAccount so the app can
  # scale the engine and materialize the credentials Secret in that namespace.
  trinoNamespace: ""
  trinoDeployment: "trino-coordinator"
  # Worker Deployment name, only used when the engine topology is "cluster"
  # (the default in TrinoEngineConfig). Empty falls back to "trino-worker".
  # A cluster topology pointing at a Deployment that does not exist fails the
  # engine start, so either create it or switch the topology to "single" on the
  # Engine config screen.
  trinoWorkerDeployment: ""
  logLevel: info
  # Public hostname (used for mailer links via APP_HOST). Leave empty to fall
  # back to localhost.
  host: ""
  # Hosts allowed to reach the app (RAILS_ALLOWED_HOSTS). When set, Rails host
  # authorization is enabled. Include the ingress host here.
  allowedHosts: []

# Trino provisioner: "chart" (TrinoCoordinator CR), "baleia" (BaleiaTrinoProvisioner),
# or "fake" (FakeTrinoRuntime for dev/test). Defaults to "chart" so a plain
# install provisions the ephemeral Trino Deployment instead of a stub.
trino:
  provisioner: chart

# OIDC / SSO configuration. Set oidc.issuer to enable SSO.
oidc:
  issuer: ""
  clientId: ""
  clientSecret: ""
  redirectUri: ""
  providerLabel: SSO

# Bootstrap an admin account during the pre-install seed (db:prepare). The
# app only creates it when BOTH env vars are set (seeds.rb); setting just the
# email raises KeyError and fails the migration hook. Password is interpolated
# by the seed, so it is not shown in the UI afterwards.
admin:
  bootstrap:
    email: ""
    password: ""

service:
  type: ClusterIP
  port: 80
  targetPort: http

# Observability. Application metrics are always exposed on GET <path> by the
# web pod (port 80, the same listener that serves the app); a cluster-side
# PodMonitor scrapes it. Service metrics (HTTP/SQL/process) are opt-in.
# Structured JSON logging goes to STDOUT so the cluster log collector (Loki via
# Promtail/Alloy) can parse it. See docs/helm-remediation.md.
metrics:
  enabled: true
  path: /metrics
  # Port the metrics endpoint is served on; must match the web container port.
  port: 80
  # Opt-in service metrics (HTTP requests, SQL queries, process CPU/memory).
  serviceMetrics: false

logging:
  # "json" (structured, parseable by Loki/Logstash) or "text" (human-readable).
  format: json

ingress:
  enabled: false
  className: ""
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API exposure (opt-in alternative to Ingress). Enable gateway.enabled
# to have the chart create its own Gateway, or httproute.enabled to attach an
# HTTPRoute to an existing (shared) Gateway. Enable at most one of
# ingress/gateway/httproute - the chart does not enforce exclusivity.
gateway:
  enabled: false
  # Required when gateway.enabled is true (e.g. "cilium").
  className: ""
  # Optional static Gateway addresses (e.g. a reserved LoadBalancer IP).
  addresses: []
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Optional, free-form per-listener fields (allowedRoutes, hostname, tls):
      # allowedRoutes: {}
      # hostname: "*.example.com"
      # tls:
      #   mode: Terminate
      #   certificateRefs:
      #     - name: my-tls-secret

httproute:
  enabled: false
  # Empty gatewayName/gatewayNamespace resolve to the chart's own Gateway (the
  # one created when gateway.enabled is true). Point them at an external
  # Gateway to share a platform-managed Gateway instead. Cross-namespace
  # references additionally require a ReferenceGrant.
  gatewayName: ""
  gatewayNamespace: ""
  hosts: []

# web resources. Empty ({}) previously - unlike every worker, which all have
# defaults - so a plain install ran the pod serving HTTP with no requests or
# limits at all.
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits:   { cpu: 1000m, memory: 1Gi }

podSecurityContext: {}

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Mounted on the app's ServiceAccount by default; every workload except the
# migration Job talks to the k8s API (Trino provisioning, catalog secrets),
# so this stays true except where a template overrides it explicitly.
automountServiceAccountToken: true

serviceAccount:
  # e.g. eks.amazonaws.com/role-arn or iam.gke.io/gcp-service-account, for
  # cloud IAM federation. Empty by default.
  annotations: {}

# Extra env vars appended to every workload's container, e.g. for a setting
# this chart has no dedicated value for.
extraEnv: []
# Extra volumes/mounts on every workload, e.g. to inject a sidecar cert or a
# config file this chart does not model directly.
extraVolumes: []
extraVolumeMounts: []
# Extra pod-level annotations/labels merged onto every workload's template,
# e.g. a Prometheus scrape override or a service-mesh injection label.
podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Solid Queue supervisor (bin/jobs): workers + recurring schedules.
worker:
  enabled: true
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  # Empty inherits the top-level `securityContext` (PSA restricted compliant).
  # Set only to deviate from it for this workload.
  securityContext: {}

# Freshness runs on its own process so it never waits behind an optimize.
workerFreshness:
  enabled: true
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  # Empty inherits the top-level `securityContext`.
  securityContext: {}

# Engine lifecycle — supervise start, drain, watchdog.
workerEngine:
  enabled: true
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 250m, memory: 512Mi }
  # Empty inherits the top-level `securityContext`.
  securityContext: {}

# Schema migrations run as a pre-install/pre-upgrade Job so web and worker
# pods never race against schema changes.
migrationJob:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  resources: {}
