{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "deepdiver.fullname" . }}
  labels:
    {{- include "deepdiver.labels" . | nindent 4 }}
spec:
  {{- with .Values.httproute.hosts }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  parentRefs:
    - name: {{ .Values.httproute.gatewayName | default (include "deepdiver.fullname" .) }}
      namespace: {{ .Values.httproute.gatewayNamespace | default .Release.Namespace }}
  rules:
    - backendRefs:
        - name: {{ include "deepdiver.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}