apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-worker-engine
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-engine
spec:
  replicas: {{ .Values.workerEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "lakedeepdiver.workerEngineSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lakedeepdiver.workerEngineSelector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lakedeepdiver.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
        - name: internal-ca
          secret:
            secretName: {{ .Values.internalCA.existingSecret | quote }}
            optional: true
            defaultMode: 0444
            items:
              - key: {{ .Values.internalCA.caKey | quote }}
                path: {{ base .Values.internalCA.mountFile | quote }}
        {{- end }}
      containers:
        - name: solid-queue
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./bin/jobs"]
          env:
            # Engine lifecycle only — supervise start, drain, watchdog.
            - name: SOLID_QUEUE_CONFIG
              value: "config/queue-engine.yml"
            - name: SOLID_QUEUE_SKIP_RECURRING
              value: "true"
            {{- if .Values.activeRecordEncryption.existingSecret }}
            - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: primary_key
            - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: deterministic_key
            - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: key_derivation_salt
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "lakedeepdiver.fullname" . }}
            {{- if .Values.appSecrets.existingSecret }}
            - secretRef:
                name: {{ .Values.appSecrets.existingSecret | quote }}
            {{- else if .Values.appSecrets.create }}
            - secretRef:
                name: {{ include "lakedeepdiver.fullname" . }}-app
            {{- end }}
          volumeMounts:
            {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
            - name: internal-ca
              mountPath: {{ dir .Values.internalCA.mountFile | quote }}
              readOnly: true
            {{- end }}
          {{- with .Values.workerEngine.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.workerEngine.resources | nindent 12 }}
