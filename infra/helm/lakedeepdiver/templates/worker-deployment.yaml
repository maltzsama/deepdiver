apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-worker
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "lakedeepdiver.workerSelector" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "lakedeepdiver.workerSelector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lakedeepdiver.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
        - name: internal-ca
          secret:
            secretName: {{ .Values.internalCA.existingSecret | quote }}
            optional: true
            defaultMode: 0444
            items:
              - key: {{ .Values.internalCA.caKey | quote }}
                path: {{ base .Values.internalCA.mountFile | quote }}
        {{- end }}
      containers:
        - name: solid-queue
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./bin/jobs"]
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HELM_RELEASE
              value: {{ .Release.Name | quote }}
            - name: SOLID_QUEUE_CONFIG
              value: "config/queue-worker.yml"
            - name: SOLID_QUEUE_RECURRING_SCHEDULE
              value: "config/recurring.yml"
            {{- if .Values.activeRecordEncryption.existingSecret }}
            - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: primary_key
            - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: deterministic_key
            - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: key_derivation_salt
            {{- end }}
          envFrom:
            {{- include "lakedeepdiver.envFrom" . | nindent 12 }}
          volumeMounts:
            {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
            - name: internal-ca
              mountPath: {{ dir .Values.internalCA.mountFile | quote }}
              readOnly: true
            {{- end }}
          livenessProbe:
            exec:
              command: [ "pgrep", "-f", "solid_queue" ]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with default .Values.securityContext .Values.worker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}