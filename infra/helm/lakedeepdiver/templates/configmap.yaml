apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
data:
  RAILS_ENV: production
  RAILS_LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  TRINO_RUNTIME: real
  TRINO_PROVISIONER: {{ .Values.trino.provisioner | quote }}
  {{- if .Values.env.trinoUrl }}
  TRINO_URL: {{ .Values.env.trinoUrl | quote }}
  {{- end }}
  TRINO_NAMESPACE: {{ .Values.env.trinoNamespace | default .Release.Namespace | quote }}
  {{- if .Values.env.trinoDeployment }}
  TRINO_DEPLOYMENT: {{ .Values.env.trinoDeployment | quote }}
  {{- end }}
  {{- if .Values.env.host }}
  APP_HOST: {{ .Values.env.host | quote }}
  {{- end }}
  {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
  SSL_CERT_FILE: {{ .Values.internalCA.mountFile | quote }}
  INTERNAL_CA_FILE: {{ .Values.internalCA.mountFile | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  RAILS_ASSUME_SSL: "true"
  RAILS_FORCE_SSL: "true"
  {{- end }}
  {{- if .Values.env.allowedHosts }}
  RAILS_ALLOWED_HOSTS: {{ join "," .Values.env.allowedHosts | quote }}
  {{- end }}
  {{- if .Values.oidc.issuer }}
  SSO_ENABLED: "true"
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  OIDC_REDIRECT_URI: {{ .Values.oidc.redirectUri | quote }}
  OIDC_PROVIDER_LABEL: {{ .Values.oidc.providerLabel | default "SSO" | quote }}
  {{- end }}