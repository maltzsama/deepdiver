apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
data:
  RAILS_ENV: production
  RAILS_LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  # Migrations run in the pre-install/pre-upgrade Job; web pods must not run
  # db:prepare again (they would race each other with replicaCount > 1).
  SKIP_DB_PREPARE: "true"
  TRINO_RUNTIME: real
  TRINO_PROVISIONER: {{ .Values.trino.provisioner | quote }}
  {{- if .Values.env.trinoUrl }}
  TRINO_URL: {{ .Values.env.trinoUrl | quote }}
  {{- end }}
  TRINO_NAMESPACE: {{ .Values.env.trinoNamespace | default .Release.Namespace | quote }}
  {{- if .Values.env.trinoDeployment }}
  TRINO_DEPLOYMENT: {{ .Values.env.trinoDeployment | quote }}
  {{- end }}
  {{- if .Values.env.trinoWorkerDeployment }}
  TRINO_WORKER_DEPLOYMENT: {{ .Values.env.trinoWorkerDeployment | quote }}
  {{- end }}
  # The app must not derive this name itself - the Role authorizes exactly this
  # string via resourceNames.
  TRINO_CATALOG_SECRET_NAME: {{ include "lakedeepdiver.trinoSecretName" . | quote }}
  {{- if .Values.metrics.serviceMetrics }}
  PROMETHEUS_SERVICE_METRICS: "1"
  {{- end }}
  LOG_FORMAT: {{ .Values.logging.format | quote }}
  {{- if .Values.env.host }}
  APP_HOST: {{ .Values.env.host | quote }}
  {{- end }}
  {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
  # INTERNAL_CA_FILE is consumed by HttpTransport as an explicit ca_file for
  # catalog/Trino TLS. Do NOT set SSL_CERT_FILE here: pointing it at only the
  # internal CA replaces the system bundle and breaks HTTPS to public
  # endpoints (e.g. Slack webhooks).
  INTERNAL_CA_FILE: {{ .Values.internalCA.mountFile | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  RAILS_ASSUME_SSL: "true"
  RAILS_FORCE_SSL: "true"
  {{- end }}
  {{- if .Values.env.allowedHosts }}
  RAILS_ALLOWED_HOSTS: {{ join "," .Values.env.allowedHosts | quote }}
  {{- end }}
  {{- if .Values.oidc.issuer }}
  # OIDC_CLIENT_SECRET is NOT here: a ConfigMap is world-readable to anyone with
  # `get configmap` in the namespace and is kept in the Helm release. It lives
  # in the <fullname>-chart-env Secret instead. Same for the bootstrap admin
  # password. The non-secret half stays here.
  SSO_ENABLED: "true"
  OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  OIDC_REDIRECT_URI: {{ .Values.oidc.redirectUri | quote }}
  OIDC_PROVIDER_LABEL: {{ .Values.oidc.providerLabel | default "SSO" | quote }}
  {{- end }}
  {{- if and .Values.admin.bootstrap.email .Values.admin.bootstrap.password }}
  BOOTSTRAP_ADMIN_EMAIL: {{ .Values.admin.bootstrap.email | quote }}
  {{- end }}