{{- $trinoNamespace := .Values.env.trinoNamespace | default .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-trino
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
{{- include "lakedeepdiver.trinoRules" . | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-trino
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lakedeepdiver.fullname" . }}-trino
subjects:
  - kind: ServiceAccount
    name: {{ include "lakedeepdiver.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if ne $trinoNamespace .Release.Namespace }}
---
# The Trino engine lives in a dedicated namespace (env.trinoNamespace): grant
# the release-namespace ServiceAccount the same permissions there so the app
# can scale the Deployment and materialize the credentials Secret in it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-trino
  namespace: {{ $trinoNamespace }}
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
{{- include "lakedeepdiver.trinoRules" . | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-trino
  namespace: {{ $trinoNamespace }}
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "lakedeepdiver.fullname" . }}-trino
subjects:
  - kind: ServiceAccount
    name: {{ include "lakedeepdiver.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}