{{- if include "lakedeepdiver.hasChartEnvSecret" . }}
# Sensitive values that the operator supplies through chart values. They used to
# be rendered into the ConfigMap, which exposes them to anyone with `get
# configmap` in the namespace and keeps them in the Helm release history.
#
# Values passed on the command line still end up in the release; prefer an
# out-of-band Secret via appSecrets.existingSecret for anything long-lived.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-chart-env
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.oidc.issuer .Values.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if and .Values.admin.bootstrap.email .Values.admin.bootstrap.password }}
  BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.admin.bootstrap.password | quote }}
  {{- end }}
{{- end }}
