apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-web
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "lakedeepdiver.webSelector" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        {{- end }}
      labels:
        {{- include "lakedeepdiver.webSelector" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lakedeepdiver.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
        - name: internal-ca
          secret:
            secretName: {{ .Values.internalCA.existingSecret | quote }}
            optional: true
            defaultMode: 0444
            items:
              - key: {{ .Values.internalCA.caKey | quote }}
                path: {{ base .Values.internalCA.mountFile | quote }}
        {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- include "lakedeepdiver.envFrom" . | nindent 12 }}
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HELM_RELEASE
              value: {{ .Release.Name | quote }}
            {{- if .Values.activeRecordEncryption.existingSecret }}
            - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: primary_key
            - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: deterministic_key
            - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.activeRecordEncryption.existingSecret | quote }}
                  key: key_derivation_salt
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
            - name: internal-ca
              mountPath: {{ dir .Values.internalCA.mountFile | quote }}
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}