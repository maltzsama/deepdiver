apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "lakedeepdiver.webSelector" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http