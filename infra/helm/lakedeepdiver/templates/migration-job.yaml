{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lakedeepdiver.fullname" . }}-migrate
  labels:
    {{- include "lakedeepdiver.labels" . | nindent 4 }}
  annotations:
    # Runs before install/upgrade so pods never race against schema changes.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrationJob.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished | default 3600 }}
  template:
    metadata:
      annotations:
        {{- include "lakedeepdiver.podAnnotations" (dict "root" .) | nindent 8 }}
      labels:
        {{- include "lakedeepdiver.migrateSelector" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "lakedeepdiver.fullname" . }}
      # db:prepare / db/seeds.rb never talk to the k8s API - unlike web and the
      # workers, this pod has no business holding the ServiceAccount token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
        - name: internal-ca
          secret:
            secretName: {{ .Values.internalCA.existingSecret | quote }}
            optional: true
            defaultMode: 0444
            items:
              - key: {{ .Values.internalCA.caKey | quote }}
                path: {{ base .Values.internalCA.mountFile | quote }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [ "./bin/rails", "db:prepare" ]
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HELM_RELEASE
              value: {{ .Release.Name | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            {{- include "lakedeepdiver.envFrom" . | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if and .Values.internalCA.enabled .Values.internalCA.existingSecret }}
            - name: internal-ca
              mountPath: {{ dir .Values.internalCA.mountFile | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
{{- end }}