# Production overrides for the deepdiver Helm chart.
# Usage: helm upgrade --install deepdiver infra/helm/deepdiver --values infra/helm/values/prod.yaml
#
# Replace every CHANGE_ME below with the real value for the target cluster.
# Do not deploy with the placeholders.
image:
  repository: ghcr.io/maltzsama/deepdiver
  # Pin a concrete release; never "latest" in production. Kept in step with the
  # chart by release-please (see release-please-config.json extra-files): this
  # file used to drift, and an install with a stale tag silently ships an image
  # that predates the chart's assumptions.
  tag: "0.6.1" # x-release-please-version
  pullPolicy: IfNotPresent

activeRecordEncryption:
  # CHANGE_ME: name of an out-of-band Secret with primary_key,
  # deterministic_key and key_derivation_salt (generate with
  # bin/rails db:encryption:init). Without these, catalog credential secrets
  # cannot be read/written and the web pod gets no encryption keys.
  existingSecret: CHANGE_ME-ar-encryption-secret

appSecrets:
  # Created out-of-band (SealedSecrets / external controller) with DATABASE_URL,
  # DB_QUEUE_URL, RAILS_MASTER_KEY and SECRET_KEY_BASE.
  existingSecret: deepdiver-secrets
  create: false

internalCA:
  enabled: true
  mountFile: /etc/deepdiver/certs/internal-ca.crt
  # CHANGE_ME: Secret holding the internal CA (key ca.crt) that signs the
  # catalog/Trino TLS certificates.
  existingSecret: deepdiver-ca
  caKey: ca.crt

admin:
  bootstrap:
    # CHANGE_ME: set BOTH to seed an admin on first install. Setting only one
    # fails the migration Job (seeds.rb fetches the password). Omit both to
    # skip admin bootstrap.
    email: ""
    password: ""

env:
  # CHANGE_ME: Trino coordinator URL. Defaults to the conventional in-cluster
  # service name; point it at the real coordinator.
  trinoUrl: "http://trino-coordinator:8080"
  # Leave empty to trust the release namespace; set to the Trino namespace
  # when the engine lives elsewhere (remember to grant RBAC there).
  trinoNamespace: ""
  # CHANGE_ME: name of the Trino coordinator Deployment.
  trinoDeployment: "trino-coordinator"
  # Worker Deployment name. Required when the engine topology is "cluster"
  # (the default); leave empty for a single-node engine.
  trinoWorkerDeployment: ""
  logLevel: info
  # CHANGE_ME: public hostname (used for mailer links and RAILS_ALLOWED_HOSTS).
  host: ""
  allowedHosts: []

replicaCount: 1
worker:
  enabled: true
  replicaCount: 1

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
  hosts:
    - host: CHANGE_ME.ingress.host
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - CHANGE_ME.tls.host
      secretName: deepdiver-tls

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
